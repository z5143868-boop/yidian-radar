name: 竞品雷达周采集

on:
  schedule:
    # 每周一 UTC 22:00 = 北京时间周二 06:00
    # 注意 GitHub Actions 的 cron 用 UTC，且高峰期可能延迟几分钟到半小时
    - cron: '0 22 * * 0'
  workflow_dispatch:        # 允许手动触发，调试时用得上

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 需要写权限才能 commit 数据回仓库

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集
        run: python main.py
        # 不加 continue-on-error：main.py 内部已经做了容错，
        # 它返回非零只在「所有源全挂」时发生，那种情况确实该让 Actions 标红

      - name: 提交数据
        run: |
          git config user.name "competitor-radar"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "本周无数据变化，跳过提交"
          else
            git commit -m "数据采集 $(date -u +%Y-W%V)"
            git push
          fi

      - name: 采集失败时提醒
        if: failure()
        run: echo "::warning::竞品雷达采集失败，检查 collector 是否需要修复"
