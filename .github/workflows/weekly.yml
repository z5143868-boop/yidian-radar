name: 竞品雷达周采集

on:
  schedule:
    # 每周一 UTC 22:00 = 北京时间周二 06:00
    # 注意 GitHub Actions 的 cron 用 UTC，且高峰期可能延迟几分钟到半小时
    - cron: '0 22 * * 0'
  workflow_dispatch:        # 允许手动触发，调试时用得上
  push:
    branches: [main]
    paths-ignore: ['data/**', 'README.md']
    # 首次推送就跑一次，不用等到周一。
    # paths-ignore 排除 data/ 是关键：不排的话，采集完提交数据会再次触发，
    # 变成无限循环。（GitHub 对 Actions 自身的提交默认不触发，
    # 这里是双保险——手动改数据时也不会误触发。）

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 需要写权限才能 commit 数据回仓库
      issues: write         # 建周报 Issue，GitHub 会据此发通知邮件

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集
        run: python main.py
        # 不加 continue-on-error：main.py 内部已经做了容错，
        # 它返回非零只在「所有源全挂」时发生，那种情况确实该让 Actions 标红

      - name: 提交数据
        run: |
          git config user.name "competitor-radar"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "本周无数据变化，跳过提交"
          else
            git commit -m "数据采集 $(date -u +%Y-W%V)"
            git push
          fi

      - name: 发布周报 Issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Issue 是通知载体：GitHub 会给仓库所有者发邮件，
          # 手机装了 GitHub App 还有推送。整条链路都在 GitHub 内部。
          python tools/issue_body.py > /tmp/issue.md
          WEEK=$(python -c "import json;print(json.load(open('data/latest.json'))['week'])")
          gh issue create \
            --title "竞品雷达 $WEEK" \
            --body-file /tmp/issue.md \
            --label "周报" 2>/dev/null \
          || gh issue create \
            --title "竞品雷达 $WEEK" \
            --body-file /tmp/issue.md
          # 标签不存在时第一条命令会失败，退回到不带标签的版本

      - name: 采集失败时开 Issue 报警
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 失败比成功更需要通知——静默失败是这类系统最常见的死法
          gh issue create \
            --title "⚠️ 竞品雷达采集失败 $(date -u +%Y-W%V)" \
            --body "本周采集未完成，看板不会更新。

          [查看运行日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          常见原因：某个 collector 的目标站点改版，或第三方库需要升级。
          单个数据源失败不会导致整体失败，走到这里说明是全局性问题。"
