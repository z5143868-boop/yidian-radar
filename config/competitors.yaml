# 衣殿竞品雷达 - 监控名单配置
#
# 改名单只改这个文件，不用动代码。
# tier 决定监控密度：1=全量每周，2=功能+融资，3=只看融资和大动作
#
# 字段说明（全部可选，缺哪个就跳过哪个源）：
#   apple_id      App Store 数字 ID。下面这些都是 2026-09 实测验证过的。
#                 留空时脚本会按 app_name 自动查，但自动查有误匹配风险
#                 （"Alta" 会命中 Alta Networks），所以能填就填。
#                 查 ID: python -m tools.resolve "App 名字"
#   app_name      App 在商店里的完整名字，用于自动解析和人工核对
#   android_id    Google Play 包名
#   website       官网首页，抓定价和主标题
#   news_query    新闻搜索词。用公司名/产品名加引号，泛概念词查出来全是垃圾
#   founder       创始人姓名，作为社媒的降级方案单独搜一次
#   reddit_query  Reddit 搜索词，留空则跳过
#   country       商店地区，默认 us。国内竞品必须填 cn，否则查不到。
#                 Apple 的接口对中国区一样开放，版本/评分/评论全都拿得到。

