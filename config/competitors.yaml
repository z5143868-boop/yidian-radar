# ---------- 行业大盘：不绑定具体公司，捕捉赛道级信号和新玩家线索 ----------
# 这些只走 news collector。
# 中文泛词实测会混进大量 SEO 垃圾（彩票站塞关键词那种），
# 所以中文这边只保留意图明确的融资类查询。
# 每个词都实测过有真实结果。0 条的（服装品牌 融资 / 快时尚 财报 /
# fashion tech funding）已剔除，SEO 垃圾重灾区（智能镜 AI）也剔除了。
industry_queries:
  # —— 赛道本身
  - 'AI stylist app funding'
  - 'digital wardrobe startup raises'
  - 'virtual try-on startup funding'
  - 'AI 穿搭 App 融资'
  - '智能衣橱 融资'
  - 'apparel retail AI startup'

  # —— 服装行业大盘
  - '服装行业 AI'
  - '服装 品牌 出海'
  - '服装 零售 数字化'

  # —— 新消费硬件（镜小搭 / ANDA 共用这条线）
  - '新消费 硬件 融资'
  - 'AI 硬件 消费级'
  - '智能穿戴 消费电子 融资'
  - 'AI 眼镜 出货'
  - 'consumer AI hardware funding'

  # —— AI 陪伴 / 银发（ANDA）
  - 'AI 陪伴机器人'
  - '具身智能 消费'
  - '银发经济 AI'
  - 'AI companion robot elderly'

# ---------- 运行参数 ----------
settings:
  news_lookback_days: 8        # 多抓一天，防止跨周边界漏掉
  reviews_per_app: 50          # 每个 App 抓最近多少条评论
  request_delay_seconds: 3.0   # 23 个竞品近百次请求，间隔太短会被 Apple 限流
  timeout_seconds: 20
  retries: 3                   # 实测 Apple 评论接口会偶发返回空，必须重试
